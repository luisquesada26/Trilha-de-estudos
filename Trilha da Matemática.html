<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A trilha da Matemática: revisão para a prova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6FAFF; --sheet:#FFFFFF; --grid:#DCE8F5; --ink:#1E3F94; --on-ink:#FFFFFF;
  --margin:#E34A62; --mark:#FFE16B; --fig:#E7EFFF; --ok:#1F8A50; --ok-bg:#E2F6EA; --bad:#B93229; --bad-bg:#FDEBE8;
  --text:#1F2B45; --muted:#56637E; --line:#C9D7EA; --sol:#FFC93C; --capi:#B9824F; --capi-esc:#8A5A33;
  --tema:#2F6BFF;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101A2B; --sheet:#172338; --grid:#1A2940; --ink:#A5BEFF; --on-ink:#0E1830;
    --margin:#FF7E91; --mark:#7A6414; --fig:#22355A; --ok:#62D394; --ok-bg:#153626; --bad:#FF8F84; --bad-bg:#3B1E1E;
    --text:#E9EEF7; --muted:#A8B3C9; --line:#2D3D5B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101A2B; --sheet:#172338; --grid:#1A2940; --ink:#A5BEFF; --on-ink:#0E1830;
  --margin:#FF7E91; --mark:#7A6414; --fig:#22355A; --ok:#62D394; --ok-bg:#153626; --bad:#FF8F84; --bad-bg:#3B1E1E;
  --text:#E9EEF7; --muted:#A8B3C9; --line:#2D3D5B; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
  color:var(--text);
  font-family:Andika,"Trebuchet MS",Verdana,system-ui,sans-serif;
  font-size:19px;line-height:1.6;
}
main{max-width:760px;margin:0 auto;padding:22px 20px 90px;min-height:100vh}
@media (max-width:600px){body{font-size:18px} main{padding:14px 14px 80px}}
h1,h2,h3{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);line-height:1.2;margin:0}
h1{font-size:clamp(1.9rem,6vw,2.6rem);font-weight:700}
h2{font-size:1.6rem;font-weight:600;margin-bottom:.4em}
h3{font-size:1.3rem;font-weight:600;margin:1.2em 0 .5em}
p{margin:.55em 0}
mark{background:linear-gradient(transparent 35%,var(--mark) 35%,var(--mark) 90%,transparent 90%);color:inherit;padding:0 .1em}
b{color:var(--ink)}
small{color:var(--muted)}

/* Capi, a capivara */
.capi{display:flex;align-items:flex-end;gap:10px;margin:6px 0 18px}
.capi svg{width:96px;height:80px;flex:none}
.capi.peq svg{width:70px;height:58px}
.balao{position:relative;background:var(--sheet);border:2.5px solid var(--ink);border-radius:18px;padding:10px 16px;font-weight:700;max-width:46ch;margin-bottom:22px}
.balao::before{content:"";position:absolute;left:-12px;bottom:12px;border:10px solid transparent;border-right-color:var(--ink);border-left:0}
.balao::after{content:"";position:absolute;left:-8px;bottom:14px;border:8px solid transparent;border-right-color:var(--sheet);border-left:0}

.placar-topo{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 22px}
.chip{background:var(--sheet);border:2px solid var(--line);border-radius:99px;padding:6px 14px;font-family:Fredoka,sans-serif;font-weight:600;color:var(--ink)}
.chip.dias{border-color:var(--margin);color:var(--margin)}

/* Trilha */
.trilha{list-style:none;padding:0;margin:0 0 30px;position:relative}
.trilha::before{content:"";position:absolute;left:39px;top:30px;bottom:30px;border-left:5px dotted var(--line)}
.parada{position:relative;margin:0 0 14px}
.parada button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:16px;width:100%;padding:6px 8px;border-radius:16px}
.parada button:hover{background:color-mix(in srgb,var(--tema) 10%,transparent)}
.parada button:focus-visible{outline:3px solid var(--tema);outline-offset:2px}
.bola{
  width:64px;height:64px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:Fredoka,sans-serif;font-weight:700;font-size:1.7rem;color:#fff;background:var(--tema);
  box-shadow:0 5px 0 color-mix(in srgb,var(--tema) 65%,#000);position:relative;z-index:1;
}
.bola.figurinha{font-size:2.1rem;background:var(--sheet);border:4px solid var(--tema);box-shadow:0 5px 0 color-mix(in srgb,var(--tema) 65%,#000)}
.parada .info b{display:block;color:var(--text);font-size:1.05rem;line-height:1.3}
.est{color:#E2A400;font-size:1.25rem;letter-spacing:.08em}
.tag{display:inline-block;background:var(--tema);color:#fff;font-family:Fredoka,sans-serif;font-weight:600;font-size:.8rem;padding:2px 10px;border-radius:99px;margin-left:6px;vertical-align:middle}
.parada.agora .bola{animation:pulsa 1.6s ease-in-out infinite}
@keyframes pulsa{50%{transform:scale(1.08)}}

/* Álbum */
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin:10px 0 20px}
.fig-card{background:var(--sheet);border:2.5px dashed var(--line);border-radius:14px;padding:12px 8px;text-align:center;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.fig-card .em{font-size:2.8rem;line-height:1.1}
.fig-card.vazia .em{font-family:Fredoka,sans-serif;color:var(--line);font-size:2.4rem}
.fig-card.ganha{border:3px solid var(--tema);background:color-mix(in srgb,var(--tema) 12%,var(--sheet))}
.fig-card b{font-size:.92rem;line-height:1.25}
.fig-card small{font-size:.78rem;line-height:1.3}

/* Botões */
.btn{
  font:inherit;font-family:Fredoka,sans-serif;font-weight:600;font-size:1.1rem;cursor:pointer;
  background:var(--tema);color:#fff;border:0;border-radius:14px;padding:12px 22px;
  box-shadow:0 5px 0 color-mix(in srgb,var(--tema) 60%,#000);transition:transform .08s;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--tema) 60%,#000)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn.sec{background:var(--sheet);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.lapis{background:var(--sol);color:#3A2E00;box-shadow:0 5px 0 #C99A10}
.acoes{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px;align-items:center}
.voltar{all:unset;cursor:pointer;color:var(--ink);font-weight:700;display:inline-block;margin-bottom:14px}
.voltar:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* Cartões de explicação */
.faixa{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.faixa .bola{width:54px;height:54px;font-size:1.4rem}
.faixa h2{margin:0;font-size:1.45rem}
.pontos{display:flex;gap:6px;margin:6px 0 14px}
.pontos i{width:26px;height:8px;border-radius:99px;background:var(--line)}
.pontos i.feito{background:var(--tema)}
.cartao{background:var(--sheet);border:3px solid var(--tema);border-radius:20px;padding:18px 22px 22px;box-shadow:0 6px 0 color-mix(in srgb,var(--tema) 30%,transparent)}
.cartao h3:first-child{margin-top:0;font-size:1.45rem}
.cartao.entra{animation:entra .3s ease-out}
@keyframes entra{from{opacity:0;transform:translateX(24px)}}
.dica{border-left:5px solid var(--sol);background:color-mix(in srgb,var(--sol) 14%,transparent);padding:8px 12px;margin:14px 0;border-radius:0 10px 10px 0}
.exemplos{list-style:none;padding:0;margin:10px 0}
.exemplos li{padding:4px 0}
.exemplos .num{font-family:Fredoka,sans-serif;font-weight:600;color:var(--ink);font-size:1.15rem;margin-right:6px}
.tabela-wrap{overflow-x:auto;margin:12px 0}
table{border-collapse:collapse;background:var(--sheet);min-width:280px}
th,td{border:1.5px solid var(--line);padding:6px 12px;text-align:center}
th{font-family:Fredoka,sans-serif;font-weight:600;color:var(--ink)}
td.big{font-family:Fredoka,sans-serif;font-size:1.4rem;color:var(--ink)}
.conta{display:inline-grid;--cell:1.75em;font-family:Fredoka,sans-serif;font-size:1.45rem;margin:10px 0;background:var(--sheet)}
.conta span{width:var(--cell);height:var(--cell);display:flex;align-items:center;justify-content:center;border:1px solid var(--grid)}
.conta .carry{color:var(--margin);font-size:.62em;font-weight:700}
.conta .op{color:var(--margin);font-weight:700}
.conta .res{border-top:3px solid var(--ink)}
.conta .r{color:var(--ok);font-weight:700}
.contas{display:flex;flex-wrap:wrap;gap:26px;align-items:flex-start}
.galeria{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}
.galeria figure{margin:0;width:112px;text-align:center;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 6px}
.galeria figcaption{font-weight:700;font-size:.92rem;line-height:1.25}
.galeria figcaption small{display:block;font-weight:400}
.galeria.nao figure{border-color:var(--margin)}
svg.fig{width:80px;height:80px;display:block;margin:0 auto}
svg.fig *{fill:var(--fig);stroke:var(--ink);stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
svg.fig polyline{fill:none}
.q-fig svg.fig{width:130px;height:130px;margin:6px 0}

/* Desafio */
.ficha{background:var(--sheet);border:3px solid var(--tema);border-radius:20px;padding:18px 20px 24px;box-shadow:0 6px 0 color-mix(in srgb,var(--tema) 30%,transparent)}
.prog{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:.95rem;margin-bottom:8px;font-weight:700}
.fogo{color:#E8590C;font-family:Fredoka,sans-serif;font-weight:700}
.barra{height:12px;background:var(--grid);border-radius:99px;overflow:hidden;margin-bottom:18px}
.barra i{display:block;height:100%;background:var(--tema);border-radius:99px;transition:width .4s}
.enunciado{font-size:1.25rem;font-weight:700;margin:0 0 10px}
.papel{background:color-mix(in srgb,var(--sol) 20%,var(--sheet));border:2.5px dashed #D3A417;border-radius:14px;padding:14px 16px;margin:14px 0}
.papel p{margin:0 0 10px}
.opcoes{display:grid;gap:10px;margin:14px 0}
.opcao{all:unset;box-sizing:border-box;cursor:pointer;border:2.5px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--paper);display:flex;gap:12px;align-items:center}
.opcao .letra{font-family:Fredoka,sans-serif;font-weight:700;color:var(--ink);width:1.7em;height:1.7em;border:2px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-size:.9rem}
.opcao:hover{border-color:var(--tema)}
.opcao:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.opcao.sel{border-color:var(--tema);background:color-mix(in srgb,var(--tema) 14%,var(--sheet))}
.opcao.sel .letra{background:var(--tema);border-color:var(--tema);color:#fff}
.opcao.certa{border-color:var(--ok);background:var(--ok-bg)}
.opcao.errada{border-color:var(--bad);background:var(--bad-bg)}
.opcao[aria-disabled="true"]{cursor:default}
.resp{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
.resp input{font:inherit;font-family:Fredoka,sans-serif;font-size:1.6rem;width:9ch;padding:8px 12px;border-radius:12px;border:3px solid var(--tema);background:var(--paper);color:var(--text)}
.resp input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.aviso{color:var(--bad);font-weight:700;min-height:1.2em;margin:6px 0 0}
.feedback{border-radius:16px;padding:14px 16px;margin-top:16px}
.feedback.ok{background:var(--ok-bg);border:3px solid var(--ok);animation:pop .35s ease-out}
.feedback.no{background:var(--bad-bg);border:3px solid var(--bad)}
.feedback .tit{font-family:Fredoka,sans-serif;font-weight:700;font-size:1.5rem}
.feedback.ok .tit{color:var(--ok)}
.feedback.no .tit{color:var(--bad)}
.feedback .capi{margin:0 0 6px}
.feedback .balao{margin-bottom:14px}
@keyframes pop{0%{transform:scale(.9);opacity:0}70%{transform:scale(1.03)}100%{transform:scale(1)}}

/* Resultado */
.resultado{text-align:center}
.resultado .placar{font-family:Fredoka,sans-serif;font-size:clamp(3rem,12vw,4.6rem);color:var(--tema);font-weight:700;line-height:1;margin:8px 0}
.estrelas-grandes{font-size:3rem;letter-spacing:.12em;color:#E2A400}
.estrelas-grandes span{display:inline-block;animation:pop .4s ease-out both}
.estrelas-grandes span:nth-child(2){animation-delay:.2s}.estrelas-grandes span:nth-child(3){animation-delay:.4s}
.premio{background:var(--sheet);border:3px solid var(--tema);border-radius:20px;padding:16px;margin:18px auto;max-width:420px}
.premio .em{font-size:4.5rem;line-height:1;display:block;animation:gira .9s ease-out}
@keyframes gira{from{transform:scale(.2) rotate(-200deg)}}
.revisao{list-style:none;padding:0;margin:16px 0;text-align:left}
.revisao li{border-bottom:1.5px dashed var(--line);padding:10px 0}
.revisao .marca{font-weight:700;margin-right:6px}
.revisao .marca.ok{color:var(--ok)}.revisao .marca.no{color:var(--bad)}
.resultado .acoes{justify-content:center}

/* Tabuada */
.tab-box{background:color-mix(in srgb,var(--tema) 8%,var(--paper));border:2.5px solid var(--tema);border-radius:16px;padding:16px;margin:14px 0}
.tab-q{font-family:Fredoka,sans-serif;font-size:2.4rem;color:var(--ink);font-weight:700;margin:4px 0}
.tab-msg{min-height:1.6em;font-weight:700}
.tab-msg.ok{color:var(--ok)}.tab-msg.no{color:var(--bad)}
.tabuada-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:12px 0}
.tabuada-grade div{background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.92rem;line-height:1.45}
.tabuada-grade strong{font-family:Fredoka,sans-serif;color:var(--ink)}

.painel h3{margin-top:1.4em}
.painel table{width:100%}
.painel td{text-align:left}
.painel td.n{text-align:center;font-family:Fredoka,sans-serif;font-weight:600}
.tentativa{background:var(--sheet);border:2px solid var(--line);border-radius:14px;margin:10px 0;padding:0}
.tentativa summary{cursor:pointer;padding:12px 14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;list-style:none}
.tentativa summary::-webkit-details-marker{display:none}
.tentativa summary::before{content:"▸";color:var(--ink);font-weight:700}
.tentativa[open] summary::before{content:"▾"}
.tentativa .quando{color:var(--muted);font-size:.9rem}
.tentativa .nota{margin-left:auto;font-family:Fredoka,sans-serif;font-weight:700}
.tentativa .nota.boa{color:var(--ok)}.tentativa .nota.fraca{color:var(--bad)}
.tentativa ul{list-style:none;margin:0;padding:0 14px 12px;border-top:1.5px dashed var(--line)}
.tentativa li{padding:8px 0;border-bottom:1px dashed var(--line);font-size:.95rem}
.tentativa li:last-child{border-bottom:0}
.link-tent{all:unset;cursor:pointer;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-family:Fredoka,sans-serif;font-weight:700;padding:2px 12px;border-radius:8px}
.link-tent:hover{background:color-mix(in srgb,var(--ink) 14%,transparent)}
.link-tent:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.modal-fundo{position:fixed;inset:0;z-index:40;background:rgba(8,14,28,.62);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(env(safe-area-inset-bottom,0px) + 16px)}
.modal{background:var(--paper);border:3px solid var(--ink);border-radius:20px;width:min(740px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;animation:pop .25s ease-out}
.modal-topo{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:2px solid var(--line);background:var(--sheet)}
.modal-topo h3{margin:0;font-size:1.2rem}
.fechar{all:unset;cursor:pointer;flex:none;font-size:1.3rem;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--ink)}
.fechar:hover{background:var(--grid)}
.fechar:focus-visible{outline:3px solid var(--ink)}
.modal-corpo{overflow-y:auto;padding:4px 16px 20px}
.m-tent h4{font-family:Fredoka,sans-serif;color:var(--ink);font-size:1.1rem;margin:18px 0 6px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.m-tent h4 .nota{margin-left:auto;font-weight:700}
.m-tent h4 .nota.boa{color:var(--ok)}.m-tent h4 .nota.fraca{color:var(--bad)}
.m-qs{list-style:none;padding:0;margin:0}
.m-qs>li{background:var(--sheet);border:2px solid var(--line);border-left-width:7px;border-radius:12px;padding:10px 14px;margin:10px 0}
.m-qs>li.ok{border-left-color:var(--ok)}.m-qs>li.no{border-left-color:var(--bad)}
.m-enun{font-weight:700;margin:0 0 8px}
.m-enun .ic{margin-right:6px}
.m-qs>li.ok .ic{color:var(--ok)}.m-qs>li.no .ic{color:var(--bad)}
.m-ops{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.m-ops li{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:6px 10px;border-radius:10px;border:2px solid var(--line)}
.m-ops li.c{border-color:var(--ok);background:var(--ok-bg)}
.m-ops li.e{border-color:var(--bad);background:var(--bad-bg)}
.m-ops .letra{font-family:Fredoka,sans-serif;font-weight:700;color:var(--ink);width:1.6em;height:1.6em;border:2px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-size:.85rem}
.m-ops .tag{margin-left:auto;font-size:.78rem}
.m-ops li.c .tag{background:var(--ok)}.m-ops li.e .tag{background:var(--bad)}
.m-num{display:flex;flex-wrap:wrap;gap:8px 18px}
.m-num span{padding:4px 12px;border-radius:10px;border:2px solid var(--line)}
.m-num .sua.ok{border-color:var(--ok);background:var(--ok-bg)}.m-num .sua.no{border-color:var(--bad);background:var(--bad-bg)}
.estudar{margin-top:10px;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--sol) 16%,var(--sheet));border:2px dashed #D3A417}
.estudar p{margin:0 0 6px}
.link-est{all:unset;cursor:pointer;font-family:Fredoka,sans-serif;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.link-est:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:4px}
.convite{font-family:Fredoka,sans-serif;font-weight:600;font-size:1.1rem;color:var(--margin);margin:6px 0 0}
.convite b{color:var(--margin)}
.convite-fixo{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:30;background:var(--sheet);color:var(--margin);border:2px solid var(--margin);border-radius:99px;padding:5px 14px;font-family:Fredoka,sans-serif;font-weight:600;font-size:.85rem;box-shadow:0 3px 10px rgba(0,0,0,.15);pointer-events:none}
.salvo{display:inline-block;font-size:.85rem;font-weight:700;color:var(--ok);background:var(--ok-bg);border-radius:99px;padding:3px 12px}
.salvo.local{color:var(--muted);background:var(--grid)}
.confete{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confete i{position:absolute;top:-14px;width:10px;height:15px;border-radius:2px;animation:cai 1.9s ease-in forwards}
@keyframes cai{to{transform:translate(var(--x),108vh) rotate(var(--r))}}
.rodape{margin-top:40px;font-size:.85rem;color:var(--muted)}
.rodape button{all:unset;cursor:pointer;text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<div class="convite-fixo">💌 Convite da Miranda</div>
<script>

/* ---------- Ajudantes visuais ---------- */
function conta(expr){
  const m = expr.match(/^(\d+)([+\-x])(\d+)$/);
  const a = +m[1], op = m[2], b = +m[3];
  const r = op === '+' ? a + b : op === '-' ? a - b : a * b;
  const A = String(a), B = String(b), R = String(r);
  const cols = Math.max(A.length, B.length, R.length) + 1;
  const carry = Array(cols).fill('');
  let c = 0;
  if (op === '+') {
    const L = Math.max(A.length, B.length);
    for (let i = 0; i < L; i++) {
      const s = (+A[A.length - 1 - i] || 0) + (+B[B.length - 1 - i] || 0) + c;
      c = Math.floor(s / 10);
      if (c && i + 1 < L) carry[cols - 2 - i] = c;
    }
  } else if (op === 'x') {
    for (let i = 0; i < A.length; i++) {
      const s = (+A[A.length - 1 - i]) * b + c;
      c = Math.floor(s / 10);
      if (c && i + 1 < A.length) carry[cols - 2 - i] = c;
    }
  }
  const pad = s => Array(cols - s.length).fill('').concat(s.split(''));
  const sign = op === '+' ? '+' : op === '-' ? '−' : '×';
  const rowB = pad(B); rowB[0] = sign;
  let html = '';
  if (carry.some(x => x !== '')) html += carry.map(x => `<span class="carry">${x}</span>`).join('');
  html += pad(A).map(x => `<span>${x}</span>`).join('');
  html += rowB.map((x, i) => `<span class="${i === 0 ? 'op' : ''}">${x}</span>`).join('');
  html += pad(R).map(x => `<span class="res r">${x}</span>`).join('');
  return `<div class="conta" style="grid-template-columns:repeat(${cols},var(--cell))" role="img" aria-label="${a} ${sign} ${b} = ${r}">${html}</div>`;
}
const svg = inner => `<svg viewBox="0 0 100 100" class="fig" aria-hidden="true">${inner}</svg>`;
function reg(n, rot = -90) {
  const pts = [];
  for (let k = 0; k < n; k++) {
    const ang = (rot + 360 * k / n) * Math.PI / 180;
    pts.push((50 + 40 * Math.cos(ang)).toFixed(1) + ',' + (52 + 40 * Math.sin(ang)).toFixed(1));
  }
  return svg(`<polygon points="${pts.join(' ')}"/>`);
}
const FIG = {
  tri: reg(3), quad: reg(4, -45), pent: reg(5), hex: reg(6), oct: reg(8, -22.5),
  ret: svg('<rect x="10" y="28" width="80" height="46"/>'),
  los: svg('<polygon points="50,8 82,50 50,92 18,50"/>'),
  trap: svg('<polygon points="32,28 68,28 90,74 10,74"/>'),
  circ: svg('<circle cx="50" cy="50" r="38"/>'),
  aberta: svg('<polyline points="18,80 18,24 82,24 82,80"/>'),
  curva: svg('<path d="M15,78 L15,26 L85,26 L85,78 Q50,48 15,78 Z"/>'),
  cruz: svg('<polygon points="15,20 85,80 85,20 15,80"/>')
};
const galeria = (itens, nao) => `<div class="galeria${nao ? ' nao' : ''}">${itens.map(([f, n, s]) => `<figure>${FIG[f]}<figcaption>${n}${s ? `<small>${s}</small>` : ''}</figcaption></figure>`).join('')}</div>`;

const KEY = 'revisao-mat-miranda-v1', KEY_H = 'revisao-mat-miranda-hist-v1';
let cache = null, DB = null;
function load(){
  if (cache) return cache;
  try { cache = JSON.parse(localStorage.getItem(KEY)) || {best:{}, final:null}; } catch(e){ cache = {best:{}, final:null}; }
  return cache;
}
function save(s){
  cache = s;
  try { localStorage.setItem(KEY, JSON.stringify(s)); } catch(e){}
  if (DB) DB.doc('progresso/atual').set({best:s.best, final:s.final ?? null, atualizado:new Date().toISOString()}).catch(() => {});
}
function histLocal(){ try { return JSON.parse(localStorage.getItem(KEY_H)) || []; } catch(e){ return []; } }
function registrar(t){
  t.id = Date.now() + '-' + Math.random().toString(36).slice(2, 7);
  t.quando = new Date().toISOString();
  const h = histLocal(); h.unshift(t);
  try { localStorage.setItem(KEY_H, JSON.stringify(h.slice(0, 80))); } catch(e){}
  if (DB) DB.collection('tentativas').doc(t.id).set(t).catch(() => {});
}
async function historico(){
  let arr = [];
  if (DB) { try { const snap = await DB.collection('tentativas').orderBy('quando', 'desc').limit(200).get(); arr = snap.docs.map(d => d.data()); } catch(e){} }
  const ids = new Set(arr.map(x => x.id));
  for (const x of histLocal()) if (!ids.has(x.id)) arr.push(x);
  return arr.sort((a, b) => b.quando.localeCompare(a.quando));
}
async function iniciarDB(tent = 0){
  if (!window.claude || !window.claude.use) { if (tent < 10) setTimeout(() => iniciarDB(tent + 1), 500); return; }
  try { DB = await window.claude.use('db'); } catch(e){ DB = null; }
  if (!DB) return;
  try {
    const loc = load(), d = await DB.doc('progresso/atual').get();
    const r = d.exists ? d.data() : {best:{}, final:null};
    let mudouLocal = false, subir = !d.exists;
    const chaves = new Set([...Object.keys(loc.best), ...Object.keys(r.best || {})]);
    for (const k of chaves) {
      const a = loc.best[k] ?? -1, b = (r.best || {})[k] ?? -1;
      if (b > a) { loc.best[k] = b; mudouLocal = true; } else if (a > b) subir = true;
    }
    const fa = loc.final ?? -1, fb = r.final ?? -1;
    if (fb > fa) { loc.final = fb; mudouLocal = true; } else if (fa > fb) subir = true;
    if (subir) save(loc); else { cache = loc; try { localStorage.setItem(KEY, JSON.stringify(loc)); } catch(e){} }
    const snap = await DB.collection('tentativas').limit(500).get();
    const ids = new Set(snap.docs.map(x => x.data().id));
    for (const t of histLocal()) if (!ids.has(t.id)) await DB.collection('tentativas').doc(t.id).set(t);
    if (state.view === 'home') home();
  } catch(e){}
}

function salvarNome(){

  aplicarNome(); home();

/* ---------- Tela inicial: a trilha ---------- */
function home(){
  if (!NOME) return pedirNome();
  state = {view:'home'}; setTema('#2F6BFF');
  const s = load();
  const prova = new Date(2026, 9, 22);
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const dias = Math.round((prova - hoje) / 86400000);
  const totalEst = TOPICS.reduce((a, t) => a + nEst(s.best[t.id], 6), 0) + nEst(s.final, 20);
  const totalFig = TOPICS.filter((t, i) => ganhou(s, i)).length + (ganhou(s, TOPICS.length) ? 1 : 0);
  const prox = (() => { const k = TOPICS.findIndex((t, i) => !ganhou(s, i)); return k === -1 ? (ganhou(s, TOPICS.length) ? -1 : TOPICS.length) : k; })();
  let fala;
  if (totalEst === 0) fala = `Oi, ${NOME}! Eu sou a Capi. Vamos percorrer a trilha? Cada tema vale até 3 estrelas e uma figurinha para o seu álbum!`;
  else if (prox === -1) fala = 'Você completou o álbum inteiro! Pode refazer a prova final para treinar mais.';
  else if (prox === TOPICS.length) fala = 'Todas as figurinhas dos temas são suas! Agora falta só o troféu da prova final.';
  else fala = `Você já tem ${totalEst} estrelas! A próxima parada é o tema ${prox + 1}. Bora?`;
  const diasTxt = dias > 1 ? `📅 Faltam ${dias} dias para a prova` : dias === 1 ? '📅 A prova é amanhã!' : dias === 0 ? '📅 Hoje é dia de prova. Você consegue!' : '📅 Prova: 22 de outubro';
  const paradas = TOPICS.map((t, i) => {
    const g = ganhou(s, i), b = s.best[t.id];
    return `<li class="parada${i === prox ? ' agora' : ''}" style="--tema:${META[i].cor}">
      <button data-act="topic" data-arg="${i}">
        <span class="bola${g ? ' figurinha' : ''}">${g ? META[i].em : i + 1}</span>
        <span class="info"><b>${t.title}${i === prox ? '<span class="tag">Próxima parada</span>' : ''}</b><span class="est">${b == null ? '☆☆☆' : estrelas(b, 6)}</span></span>
      </button></li>`;
  }).join('');
  const gf = ganhou(s, TOPICS.length);
  const album = [...META, META_FINAL].map((m, i) => {
    const g = ganhou(s, i);
    const req = i < TOPICS.length ? `Acerte 5 de 6 no tema ${i + 1}` : 'Acerte 16 de 20 na prova final';
    return g ? `<div class="fig-card ganha" style="--tema:${m.cor}"><span class="em">${m.em}</span><b>${m.nome}</b></div>`
             : `<div class="fig-card vazia"><span class="em">?</span><small>${req}</small></div>`;
  }).join('');
  app.innerHTML = `
    <h1>A trilha de ${NOME}</h1>
    <p class="convite">💌 A <b>Miranda</b> está muito feliz de compartilhar esta trilha com os amigos. Bons estudos!</p>
    ${capi(fala)}
    <div class="placar-topo"><span class="chip">⭐ ${totalEst} de 24 estrelas</span><span class="chip">🎴 ${totalFig} de 8 figurinhas</span><span class="chip dias">${diasTxt}</span></div>
    <ol class="trilha">${paradas}
      <li class="parada${prox === TOPICS.length ? ' agora' : ''}" style="--tema:${META_FINAL.cor}">
        <button data-act="final"><span class="bola${gf ? ' figurinha' : ''}">${gf ? '🏆' : '★'}</span>
        <span class="info"><b>Prova final: 20 questões${prox === TOPICS.length ? '<span class="tag">Próxima parada</span>' : ''}</b><span class="est">${s.final == null ? '☆☆☆' : estrelas(s.final, 20)}</span></span></button>
      </li>
    </ol>
    <h2>Meu álbum de figurinhas</h2>
    <div class="album">${album}</div>
    <div class="acoes" style="margin:0 0 18px"><button class="btn sec" data-act="painel">👨‍👧 Painel dos pais: acertos e erros</button></div>
    <p class="dica">✏️ <b>Regra do jogo:</b> toda conta é feita no caderno, com lápis. Aqui você só digita a resposta.</p>
    <p class="rodape">O progresso fica salvo neste aparelho. <button data-act="reset">Começar a trilha do zero</button> · <button data-act="trocarNome">Trocar o nome</button></p>`;
  subir();
}

/* ---------- Explicação em cartões ---------- */
function topic(i, card = 0){
  i = +i; card = +card;
  const t = TOPICS[i], m = META[i];
  setTema(m.cor);
  state = {view:'topic', ti:i, card};
  const n = t.lessons.length;
  const [h, html] = t.lessons[card];
  const ultimo = card === n - 1;
  app.innerHTML = `
    <button class="voltar" data-act="home">← Voltar para a trilha</button>
    <div class="faixa"><span class="bola">${i + 1}</span><h2>${t.title}</h2></div>
    <div class="pontos" aria-label="Parte ${card + 1} de ${n}">${t.lessons.map((_, k) => `<i class="${k <= card ? 'feito' : ''}"></i>`).join('')}<i style="background:none;width:auto;height:auto;font-style:normal;font-size:.85rem;color:var(--muted);margin-left:4px">🏁 desafio</i></div>
    ${card === 0 ? capi(m.dica, true) : ''}
    <article class="cartao entra"><h3>${h}</h3>${html}</article>
    <div class="acoes">
      ${card > 0 ? `<button class="btn sec" data-act="card" data-arg="${card - 1}">← Voltar</button>` : ''}
      ${ultimo ? `<button class="btn" data-act="quiz" data-arg="${i}">Entendi! Quero o desafio 🏁</button>` : `<button class="btn" data-act="card" data-arg="${card + 1}">Entendi! Próximo →</button>`}
    </div>`;
  if (document.getElementById('tabuada-jogo')) tabRender();
  subir();
}

/* ---------- Desafio ---------- */
function startQuiz(qs, opts){
  state = {view:'quiz', qs, i:0, sel:null, unlocked:false, checked:false, results:[], seq:0, ...opts};
  setTema(opts.mode === 'prova' ? META_FINAL.cor : META[opts.ti].cor);
  renderQuiz(); subir();
}

function renderQuiz(){
  const Q = state, q = Q.qs[Q.i], n = Q.qs.length;
  const letras = 'ABCD';
  const bloqueado = q.p && !Q.unlocked;
  let corpo = '';
  if (bloqueado) {
    corpo = `<div class="papel"><p>✏️ <b>Essa é no caderno!</b> ${q.c ? 'Arme a conta' : 'Escreva a sentença matemática ou faça o desenho'}, resolva com calma e depois volte aqui.</p>
      <button class="btn lapis" data-act="unlock">Pronto, já fiz no caderno!</button></div>`;
  } else if (q.t === 'mc') {
    corpo = `<div class="opcoes" role="radiogroup">${q.o.map((op, k) => {
      let cls = 'opcao';
      if (Q.checked) { if (k === q.a) cls += ' certa'; else if (k === Q.sel) cls += ' errada'; }
      else if (k === Q.sel) cls += ' sel';
      return `<button class="${cls}" role="radio" aria-checked="${k === Q.sel}" ${Q.checked ? 'aria-disabled="true"' : `data-act="pick" data-arg="${k}"`}><span class="letra">${letras[k]}</span><span>${op}</span></button>`;
    }).join('')}</div>`;
  } else {
    corpo = `<div class="resp"><label for="ans" style="font-weight:700">Resposta:</label><input id="ans" inputmode="numeric" autocomplete="off" ${Q.checked ? 'disabled' : ''} value="${Q.checked ? Q.results[Q.results.length - 1].ans : ''}"></div>`;
  }
  let fb = '';
  if (Q.checked) {
    const r = Q.results[Q.results.length - 1];
    const certa = q.t === 'mc' ? q.o[q.a] : fmt(q.a);
    fb = r.ok
      ? `<div class="feedback ok" role="status"><div class="tit">${Q.elogio}${Q.seq >= 3 ? ` 🔥 ${Q.seq} seguidas!` : ''}</div><p>${q.e}</p></div>`
      : `<div class="feedback no" role="status">${capi(Q.elogio, true)}<p>A resposta certa é <b>${certa}</b>.</p><p>${q.e}</p>${q.c ? `<p style="margin-bottom:0">Compare com o seu caderno:</p>${conta(q.c)}` : ''}</div>`;
    fb += `<div class="acoes"><button class="btn" data-act="next" id="btn-next">${Q.i + 1 < n ? 'Próxima →' : 'Ver meu resultado 🎉'}</button></div>`;
  }
  const podeConfirmar = !bloqueado && !Q.checked;
  const acertos = Q.results.filter(r => r.ok).length;
  app.innerHTML = `
    <button class="voltar" data-act="${Q.mode === 'prova' ? 'home' : 'topic'}" data-arg="${Q.ti ?? ''}">← Sair ${Q.mode === 'prova' ? 'da prova' : 'do desafio'}</button>
    <h2>${Q.title}</h2>
    <div class="ficha">
      <div class="prog"><span>Questão ${Q.i + 1} de ${n}</span>${Q.mode === 'prova' ? '<span>A correção vem no final</span>' : `<span>${Q.seq >= 2 ? `<span class="fogo">🔥 ${Q.seq}</span> ` : ''}✔ ${acertos}</span>`}</div>
      <div class="barra"><i style="width:${(Q.i + (Q.checked ? 1 : 0)) / n * 100}%"></i></div>
      <p class="enunciado">${q.q}</p>
      ${q.fig ? `<div class="q-fig">${FIG[q.fig]}</div>` : ''}
      ${corpo}
      ${podeConfirmar ? `<div class="acoes"><button class="btn" data-act="confirm">${Q.mode === 'prova' ? (Q.i + 1 < n ? 'Responder e seguir' : 'Entregar a prova') : 'Conferir'}</button></div><p class="aviso" id="aviso"></p>` : ''}
      ${fb}
    </div>`;
  const inp = document.getElementById('ans');
  if (inp && !inp.disabled) inp.focus({preventScroll:true});
  const nb = document.getElementById('btn-next');
  if (nb) nb.focus({preventScroll:true});
}

function confirmar(){
  const Q = state, q = Q.qs[Q.i];
  let ans, ok;
  if (q.t === 'mc') {
    if (Q.sel == null) { document.getElementById('aviso').textContent = 'Escolha uma opção.'; return; }
    ans = Q.sel; ok = ans === q.a;
  } else {
    ans = document.getElementById('ans').value.trim();
    if (!ans) { document.getElementById('aviso').textContent = 'Digite a resposta.'; return; }
    if (isNaN(toNum(ans))) { document.getElementById('aviso').textContent = 'Digite só números.'; return; }
    ok = toNum(ans) === q.a;
  }
  Q.results.push({q, ans, ok});
  Q.seq = ok ? Q.seq + 1 : 0;
  if (Q.mode === 'prova') return proxima();
  Q.checked = true;
  Q.elogio = ok ? rnd(ELOGIOS) : rnd(QUASE);
  renderQuiz();
  if (ok) confete(Q.seq >= 3 ? 70 : 35);
}

function proxima(){
  const Q = state;
  Q.i++; Q.sel = null; Q.unlocked = false; Q.checked = false;
  if (Q.i >= Q.qs.length) resultado(); else { renderQuiz(); subir(); }
}

function resultado(){
  const Q = state, n = Q.qs.length;
  const acertos = Q.results.filter(r => r.ok).length;
  const s = load();
  const idx = Q.mode === 'prova' ? TOPICS.length : Q.ti;
  const tinha = ganhou(s, idx);
  if (Q.mode === 'prova') s.final = Math.max(s.final ?? 0, acertos);
  else s.best[TOPICS[Q.ti].id] = Math.max(s.best[TOPICS[Q.ti].id] ?? 0, acertos);
  save(s);
  registrar({
    tipo: Q.mode === 'prova' ? 'prova' : 'desafio', tema: Q.mode === 'prova' ? null : Q.ti,
    titulo: Q.mode === 'prova' ? 'Prova final' : `Desafio ${Q.ti + 1}: ${TOPICS[Q.ti].title}`,
    acertos, total: n,
    respostas: Q.results.map(r => ({
      q: r.q.q, ok: r.ok, tema: r.q.tm ?? Q.ti,
      opcoes: r.q.t === 'mc' ? r.q.o : null, marcada: r.q.t === 'mc' ? r.ans : null,
      resposta: r.q.t === 'mc' ? r.q.o[r.ans] : String(r.ans),
      certa: r.q.t === 'mc' ? r.q.o[r.q.a] : fmt(r.q.a)
    }))
  });
  const m = Q.mode === 'prova' ? META_FINAL : META[Q.ti];
  const meta = Q.mode === 'prova' ? 16 : 5;
  const novaFig = !tinha && acertos >= meta;
  const pct = acertos / n;
  const msg = pct === 1 ? 'Gabaritou! Nota máxima!' : pct >= .8 ? 'Excelente! Você está mandando muito bem.' : pct >= .6 ? 'Muito bem! Revise o que errou e tente de novo.' : 'Respira e tenta de novo: releia a explicação com calma. Você consegue!';
  const k = nEst(acertos, n);
  let premio = '';
  if (novaFig) premio = `<div class="premio"><span class="em">${m.em}</span><h3 style="margin:.4em 0 0">Figurinha nova!</h3><p style="margin:.2em 0 0">${m.nome} foi para o seu álbum.</p></div>`;
  else if (!tinha) premio = `<div class="premio" style="border-style:dashed">${capi(`Faltou ${meta - acertos === 1 ? 'só 1 acerto' : `${meta - acertos} acertos`} para ganhar a figurinha ${m.em}. Tenta de novo?`, true)}</div>`;
  const lista = Q.results.map((r, j) => {
    const certa = r.q.t === 'mc' ? r.q.o[r.q.a] : fmt(r.q.a);
    const deu = r.q.t === 'mc' ? r.q.o[r.ans] : r.ans;
    return `<li><span class="marca ${r.ok ? 'ok' : 'no'}">${r.ok ? '✔' : '✘'}</span><b>${j + 1})</b> ${r.q.q}
      ${r.ok ? '' : `<br><small>Você respondeu: ${deu}.</small> Certa: <b>${certa}</b>.<br><small>${r.q.e}</small>${estudarHTML(r.q)}`}</li>`;
  }).join('');
  let revisar = '';
  if (Q.mode === 'prova') {
    const temas = [...new Set(Q.results.filter(r => !r.ok).map(r => r.q.tm))];
    if (temas.length) revisar = `<h3>Temas para revisar</h3><div class="acoes" style="margin-top:6px">${temas.map(t => `<button class="btn sec" data-act="topic" data-arg="${t}">${t + 1}. ${TOPICS[t].title}</button>`).join('')}</div>`;
  }
  app.innerHTML = `
    <div class="resultado">
      <h2>${Q.title}</h2>
      <div class="estrelas-grandes" aria-label="${k} de 3 estrelas">${[0,1,2].map(x => `<span>${x < k ? '★' : '☆'}</span>`).join('')}</div>
      <div class="placar">${acertos} de ${n}</div>
      <p style="font-size:1.2rem;font-weight:700">${msg}</p>
      ${premio}
      <div class="acoes">
        <button class="btn" data-act="home">Voltar para a trilha</button>
        <button class="btn sec" data-act="${Q.mode === 'prova' ? 'final' : 'quiz'}" data-arg="${Q.ti ?? ''}">Fazer de novo</button>
        ${Q.mode === 'treino' ? `<button class="btn sec" data-act="topic" data-arg="${Q.ti}">Rever a explicação</button>` : ''}
      </div>
      ${revisar}
      <h3>Correção</h3>
      <ul class="revisao">${lista}</ul>
    </div>`;
  subir();
  if (novaFig) confete(110); else if (pct >= .8) confete(50);
}

/* ---------- Painel dos pais ---------- */
const dataBR = iso => new Date(iso).toLocaleString('pt-BR', {weekday:'short', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
async function painel(){
  state = {view:'painel'}; setTema('#2F6BFF');
  app.innerHTML = '<button class="voltar" data-act="home">← Voltar para a trilha</button><h2>Painel dos pais</h2><p>Carregando…</p>';
  const h = await historico();
  if (state.view !== 'painel') return;
  state.h = h;
  const s = load();
  const onde = DB ? '<span class="salvo">✓ Salvo na sua conta Claude: aparece em qualquer aparelho</span>' : '<span class="salvo local">Salvo neste aparelho e neste navegador</span>';
  const linhas = TOPICS.map((t, i) => {
    const ts = h.filter(x => x.tipo === 'desafio' && x.tema === i);
    const ult = ts[0];
    return `<tr><td>${i + 1}. ${t.title}</td><td class="n">${ts.length || s.best[t.id] != null ? `<button class="link-tent" data-act="tent" data-arg="${i}" aria-label="Ver respostas do tema ${i + 1}">${ts.length || '1*'}</button>` : 0}</td><td class="n">${s.best[t.id] != null ? s.best[t.id] + '/6' : '–'}</td><td class="n">${ult ? ult.acertos + '/6' : s.best[t.id] != null ? s.best[t.id] + '/6*' : '–'}</td></tr>`;
  }).join('');
  const pf = h.filter(x => x.tipo === 'prova'), tb = h.filter(x => x.tipo === 'tabuada');
  const erros = {};
  for (const t of h) for (const r of (t.respostas || [])) if (!r.ok && t.tipo !== 'tabuada') {
    const e = erros[r.q] || (erros[r.q] = {q:r.q, certa:r.certa, n:0, tema:r.tema});
    e.n++;
  }
  const errosTab = {};
  for (const t of tb) for (const r of t.respostas || []) if (!r.ok) errosTab[r.q] = (errosTab[r.q] || 0) + 1;
  const topErros = Object.values(erros).sort((a, b) => b.n - a.n).slice(0, 10);
  const tabTxt = Object.entries(errosTab).sort((a, b) => b[1] - a[1]).map(([q, n]) => `${q}${n > 1 ? ` (${n}×)` : ''}`).join(', ');
  const lista = h.map(t => {
    const boa = t.acertos / t.total >= .8;
    return `<details class="tentativa"><summary><b>${t.titulo}</b><span class="quando">${dataBR(t.quando)}</span><span class="nota ${boa ? 'boa' : t.acertos / t.total < .6 ? 'fraca' : ''}">${t.acertos} de ${t.total}</span></summary>
      <ul>${(t.respostas || []).map(r => `<li><span class="marca ${r.ok ? 'ok' : 'no'}" style="font-weight:700;color:var(--${r.ok ? 'ok' : 'bad'})">${r.ok ? '✔' : '✘'}</span> ${r.q}<br><small>Respondeu: <b>${r.resposta}</b>${r.ok ? '' : ` · Certa: <b>${r.certa}</b>`}</small></li>`).join('')}</ul></details>`;
  }).join('');
  app.innerHTML = `
    <div class="painel">
      <button class="voltar" data-act="home">← Voltar para a trilha</button>
      <h2>Painel dos pais</h2>
      <p>${onde}</p>
      ${TOPICS.some((t, i) => s.best[t.id] != null && !h.some(x => x.tipo === 'desafio' && x.tema === i)) ? `<p class="dica"><b>*</b> Tentativa feita antes de o painel existir: só a nota ficou salva, sem as respostas. Se refizer esses desafios (6 questões cada), cada resposta vai aparecer aqui.</p>` : ''}
      <h3>Resumo por tema</h3>
      <div class="tabela-wrap"><table>
        <tr><th>Tema</th><th>Tentativas</th><th>Melhor</th><th>Última</th></tr>${linhas}
        <tr><td>★ Prova final</td><td class="n">${pf.length || s.final != null ? `<button class="link-tent" data-act="tent" data-arg="f" aria-label="Ver respostas da prova final">${pf.length || '1*'}</button>` : 0}</td><td class="n">${s.final != null ? s.final + '/20' : '–'}</td><td class="n">${pf[0] ? pf[0].acertos + '/20' : s.final != null ? s.final + '/20*' : '–'}</td></tr>
      </table></div>
      ${tabTxt ? `<p><b>Tabuada relâmpago</b> (${tb.length} ${tb.length === 1 ? 'jogo' : 'jogos'}). Contas com erro: ${tabTxt}</p>` : ''}
      <h3>Questões com mais erros</h3>
      ${topErros.length ? `<ul class="revisao">${topErros.map(e => `<li><span class="marca no">✘ ${e.n}×</span> ${e.q}<br><small>Resposta certa: <b>${e.certa}</b></small>${estudarHTML(ALLQ.find(x => x.q === e.q))}</li>`).join('')}</ul>` : '<p><small>Nenhum erro registrado ainda.</small></p>'}
      <h3>Todas as tentativas</h3>
      <p><small>Toque em uma tentativa para ver cada resposta.</small></p>
      ${lista || '<p>Ainda não há tentativas registradas. A partir de agora, cada desafio, prova e jogo de tabuada fica guardado aqui.</p>'}
    </div>`;
  subir();
}

/* ---------- Modal com as respostas ---------- */
const ALLQ = [...TOPICS.flatMap(t => t.quiz), ...FINAL];
function tentModal(arg){
  fecharModal();
  const fin = arg === 'f', i = fin ? null : +arg;
  const h = (state.h || []).filter(x => fin ? x.tipo === 'prova' : (x.tipo === 'desafio' && x.tema === i));
  const s = load();
  const best = fin ? s.final : s.best[TOPICS[i].id], tot = fin ? 20 : 6;
  const titulo = fin ? 'Prova final' : `Tema ${i + 1}: ${TOPICS[i].title}`;
  const letras = 'ABCD';
  const blocos = h.map((t, n) => {
    const pct = t.acertos / t.total;
    const qs = (t.respostas || []).map((r, j) => {
      const meta = ALLQ.find(x => x.q === r.q);
      const ops = r.opcoes || (meta && meta.t === 'mc' ? meta.o : null);
      let corpo;
      if (ops) {
        const marc = r.marcada ?? ops.indexOf(r.resposta);
        const certa = meta && meta.t === 'mc' ? meta.a : ops.indexOf(r.certa);
        corpo = `<ul class="m-ops">${ops.map((o, k) => {
          const cls = k === certa ? 'c' : (k === marc ? 'e' : '');
          const tag = k === marc ? `<span class="tag">${k === certa ? '✔ marcada (certa)' : '✘ marcada'}</span>` : (k === certa ? '<span class="tag">✔ resposta certa</span>' : '');
          return `<li class="${cls}"><span class="letra">${letras[k]}</span><span>${o}</span>${tag}</li>`;
        }).join('')}</ul>`;
      } else {
        corpo = `<div class="m-num"><span class="sua ${r.ok ? 'ok' : 'no'}">Resposta dada: <b>${r.resposta}</b></span>${r.ok ? '' : `<span>Certa: <b>${r.certa}</b></span>`}</div>`;
      }
      return `<li class="${r.ok ? 'ok' : 'no'}"><p class="m-enun"><span class="ic">${r.ok ? '✔' : '✘'}</span>${j + 1}) ${r.q}</p>${meta && meta.fig ? `<div class="q-fig">${FIG[meta.fig]}</div>` : ''}${corpo}${r.ok ? '' : estudarHTML(meta, true)}</li>`;
    }).join('');
    return `<section class="m-tent"><h4>Tentativa ${h.length - n} <small>${dataBR(t.quando)}</small><span class="nota ${pct >= .8 ? 'boa' : pct < .6 ? 'fraca' : ''}">${t.acertos} de ${t.total}</span></h4><ol class="m-qs">${qs}</ol></section>`;
  }).join('');
  const legado = `<section class="m-tent"><h4>Tentativa 1 <small>antes do painel</small><span class="nota">${best} de ${tot}</span></h4><p>Essa tentativa foi feita antes de o painel existir, então só a nota ficou salva. Não dá para ver o que foi marcado em cada questão.</p><p>Se refizer este desafio, cada pergunta aparece aqui com as opções e a resposta marcada.</p></section>`;
  const ov = document.createElement('div');
  ov.className = 'modal-fundo';
  ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-tit"><div class="modal-topo"><h3 id="m-tit">${titulo}</h3><button class="fechar" data-act="fecharModal" aria-label="Fechar">✕</button></div><div class="modal-corpo">${blocos || (best != null ? legado : '<p>Nenhuma tentativa ainda.</p>')}</div></div>`;
  ov.addEventListener('click', e => { if (e.target === ov) fecharModal(); });
  document.body.appendChild(ov);
  document.body.style.overflow = 'hidden';
  ov.querySelector('.fechar').focus();
}
function fecharModal(){
  const m = document.querySelector('.modal-fundo');
  if (m) m.remove();
  document.body.style.overflow = '';
}

/* ---------- Tabuada relâmpago ---------- */
let tab = null;
function tabRender(){
  const box = document.getElementById('tabuada-jogo');
  if (!box) return;
  if (!tab) {
    box.innerHTML = `<div class="tab-box"><h3 style="margin-top:0">⚡ Tabuada relâmpago</h3><p>10 contas de tabuada, de cabeça. Quantas você acerta?</p><button class="btn" data-act="tabStart">Começar</button></div>`;
    return;
  }
  if (tab.i >= tab.qs.length) {
    box.innerHTML = `<div class="tab-box"><h3 style="margin-top:0">⚡ Tabuada relâmpago</h3><p class="tab-q">${tab.ok} de 10</p><p><b>${tab.ok === 10 ? 'Gabaritou! Fera da tabuada! 👑' : tab.ok >= 8 ? 'Muito bem! Quase perfeito.' : 'Treine as que errou e jogue de novo.'}</b></p>${tab.erros.length ? `<p><small>Para treinar: ${tab.erros.join(', ')}</small></p>` : ''}<button class="btn" data-act="tabStart">Jogar de novo</button></div>`;
    if (tab.ok >= 8) confete(50);
    return;
  }
  const [a, b] = tab.qs[tab.i];
  box.innerHTML = `<div class="tab-box"><h3 style="margin-top:0">⚡ Tabuada relâmpago</h3>
    <p style="margin:0;color:var(--muted)">Conta ${tab.i + 1} de 10. Acertos: ${tab.ok}</p>
    <p class="tab-q">${a} × ${b} = ?</p>
    <div class="resp" style="margin-top:0"><input id="tab-ans" inputmode="numeric" autocomplete="off" aria-label="Resposta"><button class="btn" data-act="tabCheck">Ok</button></div>
    <p class="tab-msg ${tab.last?.ok ? 'ok' : 'no'}">${tab.last ? (tab.last.ok ? rnd(ELOGIOS) : `Era ${tab.last.r}.`) : ''}</p></div>`;
  document.getElementById('tab-ans').focus({preventScroll:true});
}
function tabStart(){
  const qs = [];
  for (let k = 0; k < 10; k++) qs.push([2 + Math.floor(Math.random() * 8), Math.floor(Math.random() * 10)]);
  tab = {qs, i:0, ok:0, erros:[], last:null, log:[]};
  tabRender();
}
function tabCheck(){
  const inp = document.getElementById('tab-ans');
  if (!inp || !inp.value.trim()) return;
  const [a, b] = tab.qs[tab.i];
  const ok = toNum(inp.value) === a * b;
  if (ok) tab.ok++; else tab.erros.push(`${a} × ${b} = ${a * b}`);
  tab.last = {ok, r: a * b};
  tab.log.push({q:`${a} × ${b}`, resposta:inp.value.trim(), certa:String(a * b), ok, tema:4});
  tab.i++;
  if (tab.i >= tab.qs.length) registrar({tipo:'tabuada', tema:4, titulo:'Tabuada relâmpago', acertos:tab.ok, total:10, respostas:tab.log});
  tabRender();
}

/* ---------- Ações ---------- */
const actions = {
  home,
  painel,
  salvarNome,
  trocarNome: () => { NOME = ''; try { localStorage.removeItem('revisao-mat-nome'); } catch(e){} aplicarNome(); pedirNome(); },
  tent: tentModal,
  estudar: a => { const [tm, lk] = a.split('-').map(Number); fecharModal(); tab = null; topic(tm, lk); },
  fecharModal,
  topic: i => { tab = null; topic(i, 0); },
  card: c => topic(state.ti, c),
  quiz: i => { i = +i; startQuiz(TOPICS[i].quiz, {mode:'treino', ti:i, title:`Desafio do tema ${i + 1}`}); },
  final: () => startQuiz(FINAL, {mode:'prova', title:'Prova final'}),
  unlock: () => { state.unlocked = true; renderQuiz(); },
  pick: k => { state.sel = +k; renderQuiz(); },
  confirm: confirmar,
  next: proxima,
  tabStart, tabCheck,
  reset: () => { if (confirm('Apagar todas as estrelas e figurinhas e começar do zero?')) { save({best:{}, final:null}); home(); } }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  actions[b.dataset.act](b.dataset.arg);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') return fecharModal();
  if (e.key !== 'Enter') return;
  if (e.target.id === 'ans') { e.preventDefault(); confirmar(); }
  else if (e.target.id === 'tab-ans') { e.preventDefault(); tabCheck(); }
  else if (e.target.id === 'nome') { e.preventDefault(); salvarNome(); }
});
home();
</script>
